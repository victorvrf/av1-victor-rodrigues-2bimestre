<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Imagem - NASA Explorer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="fs-4 fw-bold">🚀 NASA Explorer</span>
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">← Voltar Home</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        
        <!-- Feedback Messages -->
        <div id="errorMessage" class="alert alert-danger d-none text-center" role="alert"></div>
        
        <!-- Spinner -->
        <div id="loadingSpinner" class="text-center my-5">
            <div class="spinner-grow text-info" style="width: 4rem; height: 4rem;" role="status">
                <span class="visually-hidden">Carregando detalhes...</span>
            </div>
            <h4 class="mt-4 text-light">Analisando dados do espaço...</h4>
        </div>

        <!-- Detalhes do item -->
        <div id="detalhesContainer" class="detail-container d-none">
            <div class="row">
                <div class="col-lg-7 mb-4 mb-lg-0 text-center">
                    <img id="imagemApod" src="" alt="NASA APOD" class="img-fluid detail-img">
                </div>
                <div class="col-lg-5 d-flex flex-column justify-content-center">
                    <h2 id="tituloApod" class="text-primary fw-bold mb-3"></h2>
                    <p class="badge bg-secondary fs-6 mb-4" id="dataApod"></p>
                    <div class="descricao-scroll" style="max-height: 400px; overflow-y: auto; padding-right: 15px;">
                        <p id="descricaoApod" class="text-light lh-lg" style="text-align: justify;"></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/detalhes.js"></script>
</body>
</html>
